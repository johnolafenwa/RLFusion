[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlfusion"
version = "0.1.0"
description = "Frontier post-training for LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "John Olafenwa", email = "johnolafenwa@gmail.com"},
]
dependencies = [
    "accelerate>=1.12.0",
    "torch",
    # Keep unpinned so uv can resolve the newest compatible Transformers release.
    "transformers",
    "wandb",
    "datasets",
    "regex",
    "tqdm",
    "numpy<2.3"
]

[project.optional-dependencies]
flash = [
    "flash-attn>=2.8.3; platform_system == 'Linux'"
]
vllm = [
    # Keep the vLLM extra aligned to the repo-standard Linux stack.
    "torch>=2.10.0,<2.11; platform_system == 'Linux'",
    "torchaudio>=2.10.0,<2.11; platform_system == 'Linux'",
    "torchvision>=0.25.0,<0.26; platform_system == 'Linux'",
    "vllm>=0.17.0,<0.18; platform_system == 'Linux'",
]
test = [
    "pytest"
]
dev = [
    "ruff",
    "ty"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
resolution = "highest"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
